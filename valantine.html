<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine?</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      z-index: 2;
    }

    h1 {
      color: #e63946;
    }

    button {
      font-size: 18px;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 8px;
    }

    #yesBtn {
      background: #e63946;
      color: white;
    }

    #noBtn {
      background: #adb5bd;
      color: white;
      position: absolute;
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 22px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-110vh); opacity: 0; }
    }

    .date-btn {
      background: white;
      color: #e63946;
      border: 2px solid #e63946;
    }

    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      margin: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Will you be my Valentine? 💕</h1>
  <button id="yesBtn">YES 💖</button>
  <button id="noBtn">NO 😶</button>
</div>

<audio id="music" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
</audio>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const music = document.getElementById("music");

  noBtn.style.left = "50%";
  noBtn.style.top = "60%";

  noBtn.addEventListener("mouseover", () => {
    noBtn.style.left = Math.random() * (window.innerWidth - 120) + "px";
    noBtn.style.top = Math.random() * (window.innerHeight - 60) + "px";
  });

  function heart() {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💖";
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = (4 + Math.random() * 4) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }

  function selectDateIdea(idea) {
    document.body.innerHTML = `
      <div style="text-align:center;color:white;">
        <h1>You chose: ${idea} 💕</h1>

        <p style="font-size:20px;">Pick our date & time 💌</p>

        <input type="date" id="datePick"><br>
        <input type="time" id="timePick"><br>

        <button onclick="finalScreen()">Confirm 💖</button>
      </div>
    `;
  }

  function finalScreen() {
    document.body.innerHTML = `
      <div style="
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        height:100vh;
        color:white;
        text-align:center;
      ">
        <h1 style="font-size:48px;">Forever starts now 💍✨</h1>
        <p style="font-size:22px;">And I can’t wait to spend it with you 💖</p>
      </div>
    `;
  }

  yesBtn.addEventListener("click", () => {
    music.play();
    setInterval(heart, 300);

    document.body.innerHTML = `
      <div style="text-align:center;color:white;">
        <h1>YAAAY! 🥰💖<br>She said yesss!!!</h1>

        <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" width="220"><br><br>
        <img src="https://cataas.com/cat/cute" width="250" style="border-radius:20px;"><br><br>

        <h2>Choose our date idea 💕</h2>

        <button class="date-btn" onclick="selectDateIdea('Romantic Dinner 🌹')">Romantic Dinner 🌹</button>
        <button class="date-btn" onclick="selectDateIdea('Movie Night 🎬')">Movie Night 🎬</button>
        <button class="date-btn" onclick="selectDateIdea('Coffee & Walk ☕')">Coffee & Walk ☕</button>
        <button class="date-btn" onclick="selectDateIdea('Sunset Date 🌄')">Sunset Date 🌄</button>
      </div>
    `;
  });
</script>

</body>
</html>
